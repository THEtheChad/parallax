name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: GNU time (Linux accounting)
        if: runner.os == 'Linux'
        run: test -x /usr/bin/time || { sudo apt-get update -q && sudo apt-get install -y -q time; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Smoke run (tsc 7 against itself; checks this OS's CPU and memory backends)
        run: node scripts/ci-smoke.ts out/ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: out/ci
          if-no-files-found: ignore
          retention-days: 14
